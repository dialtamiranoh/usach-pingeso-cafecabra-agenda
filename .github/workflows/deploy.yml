name: Deploy to Cloudflare

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # ---------- PRODUCCIÓN (main) ----------
      - name: Build (production)
        if: github.ref == 'refs/heads/main'
        run: npm run build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Apply D1 migrations (production)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler d1 migrations apply cafe_cabra_agenda_db --remote

      - name: Set secrets (production)
        if: github.ref == 'refs/heads/main'
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          printf '%s' "$BETTER_AUTH_SECRET" | npx wrangler secret put BETTER_AUTH_SECRET
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY

      - name: Deploy (production)
        if: github.ref == 'refs/heads/main'
        run: npx @vinext/cloudflare deploy --skip-build --config dist/server/wrangler.json

      # ---------- DEV (dev) ----------
      - name: Build (dev)
        if: github.ref == 'refs/heads/dev'
        run: npm run build
        env:
          WRANGLER_CONFIG: wrangler.dev.jsonc
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Apply D1 migrations (dev)
        if: github.ref == 'refs/heads/dev'
        run: npx wrangler d1 migrations apply cafe_cabra_agenda_db --remote --config wrangler.dev.jsonc

      - name: Set secrets (dev)
        if: github.ref == 'refs/heads/dev'
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          printf '%s' "$BETTER_AUTH_SECRET" | npx wrangler secret put BETTER_AUTH_SECRET --name usach-pingeso-cafecabra-agenda-dev
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --name usach-pingeso-cafecabra-agenda-dev

      - name: Deploy (dev)
        if: github.ref == 'refs/heads/dev'
        run: WRANGLER_CONFIG=wrangler.dev.jsonc npx @vinext/cloudflare deploy --skip-build --config dist/server/wrangler.json