name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - dev 
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # DETECTA AUTOMÁTICAMENTE LA RAMA Y CONFIGURA EL COMANDO CORRECTO
      - name: Determine Environment Flag
        id: env-selector
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "FLAG=" >> $GITHUB_OUTPUT
          else
            echo "FLAG=--env preview" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy ${{ steps.env-selector.outputs.FLAG }}
        env:
          NODE_ENV: production
