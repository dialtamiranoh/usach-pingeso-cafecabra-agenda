name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # DETECTA LA RAMA CORRESPONDIENTE
      - name: Determine Environment
        id: env-selector
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV_NAME=production" >> $GITHUB_OUTPUT
            echo "FLAG=" >> $GITHUB_OUTPUT
          else
            echo "ENV_NAME=staging" >> $GITHUB_OUTPUT
            echo "FLAG=--env staging" >> $GITHUB_OUTPUT
          fi

      # PASA EL ENTORNO DIRECTAMENTE A VINEXT DURANTE LA COMPILACIÓN
      - name: Build
        run: npm run build
        env:
          CLOUDFLARE_ENV: ${{ steps.env-selector.outputs.ENV_NAME }}
          NODE_ENV: production

      # SUEBE EL ENTORNO DE FORMA EXPLÍCITA CON LA BANDERA --ENV
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy ${{ steps.env-selector.outputs.FLAG }}
        env:
          CLOUDFLARE_ENV: ${{ steps.env-selector.outputs.ENV_NAME }}
          NODE_ENV: production
